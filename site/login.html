<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceder | Ritos del Alma</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fffaf3,#e9dff1);font-family:system-ui,sans-serif;color:#281446}.box{width:min(420px,calc(100% - 36px));padding:34px;border:1px solid #dfcfe7;border-radius:22px;background:#fffaf3;box-shadow:0 20px 50px #42225f18}h1{font:600 3rem Georgia,serif;line-height:.9;margin:0 0 13px}p{color:#75657c;line-height:1.55}button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;background:#42225f;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.note{font-size:.83rem;margin-top:18px}</style></head><body><main class="box"><p>RITOS DEL ALMA</p><h1>Tu biblioteca privada</h1><p>Ingresá con el email que usaste al comprar. Si es tu primera visita, creá tu acceso.</p><button id="email">Acceder con email</button><p class="note" id="status" role="status"></p></main><script type="module">import{start,login,signup,hasBuyerRole}from'/auth.js';await start();const status=document.querySelector('#status');document.querySelector('#email').onclick=async()=>{const email=prompt('Tu email de compra');if(!email)return;const password=prompt('Contraseña (si es tu primera vez, elegí una de al menos 8 caracteres)');if(!password)return;try{let user;try{user=await login(email,password)}catch(_){user=await signup(email,password)}if(hasBuyerRole(user))location.href='/portal/';else status.textContent='Tu cuenta fue creada. Si ya compraste, cerrá sesión e ingresá otra vez en unos instantes para activar el acceso.'}catch(e){status.textContent='No pudimos iniciar sesión. Revisá tu email y contraseña.'}};</script></body></html>
